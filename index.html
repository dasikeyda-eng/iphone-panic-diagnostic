<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아이폰 패닉풀 진단</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between text-slate-800">

    <div>
        <!-- 메인 헤더 -->
        <header class="text-center my-5">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">아이폰 패닉풀 진단</h1>
        </header>
        
        <!-- 1. 기종 검색 -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-4">
            <div class="flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-slate-800 text-white text-xs font-bold rounded-full flex items-center justify-center">1</span>
                <label class="text-sm font-bold text-slate-800">기기 모델 검색 (선택사항)</label>
            </div>
            <div class="relative">
                <input type="text" id="modelSearch" placeholder="🔍 모델 번호 입력 (예: 12, 14 Pro, SE)" 
                       class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-700 focus:bg-white transition">
            </div>
        </section>

        <!-- 2. 사진 업로드 -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-4">
            <div class="flex items-center gap-2 mb-2">
                <span class="w-6 h-6 bg-slate-800 text-white text-xs font-bold rounded-full flex items-center justify-center">2</span>
                <label class="text-sm font-bold text-slate-800">패닉 로그 사진 업로드</label>
            </div>
            
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            
            <div id="previewBox" onclick="document.getElementById('imageInput').click()" 
                 class="border-2 border-dashed border-slate-200 bg-slate-50/50 rounded-xl p-6 text-center cursor-pointer hover:bg-slate-100/50 transition">
                <div class="w-12 h-12 bg-slate-200/60 rounded-full flex items-center justify-center mx-auto mb-2 text-slate-600 text-xl">📄</div>
                <p class="text-sm font-semibold text-slate-700 mb-1">패닉 로그 화면을 촬영하거나 업로드</p>
                <p class="text-xs text-slate-400">Settings ➔ Privacy ➔ Analytics ➔ Analytics Data</p>
            </div>
        </section>

        <!-- 3. AI 진단 실행 -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 mb-4">
            <div class="flex items-center gap-2 mb-3">
                <span class="w-6 h-6 bg-slate-800 text-white text-xs font-bold rounded-full flex items-center justify-center">3</span>
                <label class="text-sm font-bold text-slate-800">AI 진단 실행</label>
            </div>
            
            <button onclick="runDiagnostic()" id="diagBtn" 
                    class="w-full bg-slate-700 text-white font-bold py-3.5 rounded-xl shadow-sm hover:bg-slate-800 active:scale-[0.99] transition disabled:bg-slate-300 flex items-center justify-center gap-2">
                <span>⚡</span> 패닉 로그 진단 시작
            </button>

            <!-- 간결하게 정돈된 두 줄 설명 메시지 -->
            <div class="mt-3 text-center">
                <p class="text-xs text-slate-500 leading-relaxed">
                    📄 Apple 공식 서비스 매뉴얼 및 iFixit 데이터 기반<br>
                    <span class="text-slate-400">검증된 팩트 중심 진단 (추측성 답변 배제)</span>
                </p>
            </div>
        </section>

        <!-- 진단 결과 출력 창 -->
        <section id="resultBox" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-3">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-1.5">
                    <span>📋</span> 진단 결과 리포트
                </h2>
                <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">분석 완료</span>
            </div>
            <div id="resultContent" class="text-sm text-slate-700 space-y-3 leading-relaxed whitespace-pre-wrap"></div>
        </section>

        <!-- 데이터 보안 안내 -->
        <section class="bg-slate-200/50 p-3.5 rounded-xl border border-slate-200/60 mb-6">
            <p class="text-xs text-slate-600 text-center leading-normal">
                🛡️ <strong>데이터 보안:</strong> 본 앱은 업로드된 사진이나 진단 기록을 서버에 저장하지 않으므로 안심하고 사용하셔도 됩니다.
            </p>
        </section>
    </div>

    <!-- 푸터 -->
    <footer class="text-center text-xs text-slate-400 py-3 leading-relaxed border-t border-slate-200/60">
        Developed by dasikeyda<br>
        무단 배포 및 상업적 도용 금지
    </footer>

    <script>
        // ⚠️ 아래 쌍따옴표 안에 구글 Gemini API 키를 넣어주세요!
        const API_KEY = "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";

        let base64Image = "";

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result.split(',')[1];
                document.getElementById('previewBox').innerHTML = `
                    <img src="${e.target.result}" class="max-h-52 mx-auto rounded-lg shadow-sm border border-slate-200">
                    <p class="text-xs text-slate-400 mt-2">터치하여 다른 사진으로 변경</p>
                `;
            }
            reader.readAsDataURL(file);
        }

        async function runDiagnostic() {
            if (!base64Image) { 
                alert("패닉 로그 사진을 먼저 업로드해 주세요!"); 
                return; 
            }
            if (API_KEY.includes("여기에")) {
                alert("코드 116번째 줄에 Gemini API 키를 입력해 주세요!");
                return;
            }

            const btn = document.getElementById('diagBtn');
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');
            const selectedModel = document.getElementById('modelSearch').value;

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin">🔄</span> 정밀 분석 및 교차 검증 중...`;
            resultBox.classList.remove('hidden');
            resultContent.innerHTML = `<p class="text-slate-400 text-center py-4">사진 속 패닉 로그 코드 읽는 중...<br>Apple 서비스 매뉴얼 및 iFixit 데이터 매칭 중입니다.</p>`;

            const prompt = `너는 아이폰 수리 전문 기사를 돕는 패닉풀 분석 AI다. 
제공된 패닉풀 로그 사진을 엄격히 분석하여 다음 형식으로 답변하라:
${selectedModel ? `[선택 기종: ${selectedModel}]` : ''}

1. 🔍 **검증된 원인 코드 및 관련 부품**: (예: Prs0 - 기압센서/충전단자)
2. 🛠️ **점검 및 수리 우선순위**:
   - 1순위 (가장 높은 확률):
   - 2순위:
   - 3순위:
3. 📖 **iFixit 가이드 요약 및 핵심 주의사항**:
   - 수리 순서 요약:
   - ⚠️ **핵심 주의사항**: (나사 길이 혼동 주의, 배터리 커넥터 선차단 등)

* 반드시 Apple 공식 수리 매뉴얼 및 iFixit 데이터 기반의 100% 검증된 팩트만 명시하라.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    resultContent.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    resultContent.innerText = "❌ 사진을 읽을 수 없거나 분석에 실패했습니다. 사진을 더 밝고 선명하게 찍어주세요.";
                }
            } catch (err) {
                resultContent.innerText = "❌ 진단 도중 네트워크 오류가 발생했습니다. API 키를 다시 확인해 주세요.";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>⚡</span> 패닉 로그 진단 시작`;
            }
        }
    </script>
</body>
</html>
