<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이폰 패닉풀 진단</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between">
    <div>
        <h1 class="text-2xl font-bold text-slate-800 text-center my-4">아이폰 패닉풀 진단</h1>
        
        <!-- 1. 기종 검색 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
            <label class="block text-sm font-semibold text-slate-700 mb-2">1. 기종 모델 검색 (선택사항)</label>
            <input type="text" id="modelSearch" placeholder="예: 12, 14 Pro, SE" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-500">
        </div>

        <!-- 2. 사진 업로드 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 text-center">
            <label class="block text-sm font-semibold text-slate-700 mb-2 text-left">2. 패닉 로그 사진 업로드</label>
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            <div id="previewBox" class="border-2 border-dashed border-slate-300 rounded-lg p-6 cursor-pointer hover:bg-slate-50" onclick="document.getElementById('imageInput').click()">
                <p class="text-sm text-slate-500">📷 패닉 로그 사진을 촬영하거나 선택하세요</p>
            </div>
        </div>

        <!-- 3. AI 진단 실행 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
            <label class="block text-sm font-semibold text-slate-700 mb-2">3. AI 진단 실행</label>
            <button onclick="runDiagnostic()" id="diagBtn" class="w-full bg-slate-700 text-white font-semibold py-3 rounded-lg shadow hover:bg-slate-800 disabled:bg-slate-300">
                ⚡ 패닉 로그 진단 시작
            </button>
            <p class="text-xs text-slate-500 mt-2.5 text-center leading-relaxed">
                📄 Apple 공식 서비스 매뉴얼 및 iFixit 데이터 기반 팩트 진단 (추측성 답변 배제)
            </p>
        </div>

        <!-- 진단 결과 출력 영역 -->
        <div id="resultBox" class="hidden bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
            <h2 class="text-lg font-bold text-slate-800 mb-3 border-b pb-2">📋 진단 결과 리포트</h2>
            <div id="resultContent" class="text-sm text-slate-700 space-y-3 whitespace-pre-wrap"></div>
        </div>

        <!-- 데이터 보안 안내 -->
        <div class="bg-slate-100 p-3.5 rounded-xl border border-slate-200 mb-6">
            <p class="text-xs text-slate-600 leading-relaxed text-center">
                🔒 <strong>데이터 보안:</strong> 본 앱은 업로드된 사진이나 진단 기록을 서버에 저장하지 않으므로 안심하고 사용하셔도 됩니다.
            </p>
        </div>
    </div>

    <!-- 하단 푸터 -->
    <footer class="text-center text-xs text-slate-400 py-4 leading-relaxed border-t border-slate-200">
        Developed by dasikeyda<br>
        무단 배포 및 상업적 도용 금지
    </footer>

    <script>
        let base64Image = "";

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Image = e.target.result.split(',')[1];
                document.getElementById('previewBox').innerHTML = `<img src="${e.target.result}" class="max-h-48 mx-auto rounded-lg">`;
            }
            reader.readAsDataURL(file);
        }

        async function runDiagnostic() {
            if (!base64Image) { alert("패닉 로그 사진을 먼저 업로드해 주세요!"); return; }
            
            const btn = document.getElementById('diagBtn');
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');
            
            btn.disabled = true;
            btn.innerText = "🔄 Gemini AI 정밀 분석 중...";
            resultBox.classList.remove('hidden');
            resultContent.innerText = "패닉풀 오류 코드 해석 및 Apple/iFixit 매뉴얼 교차 검증 중입니다...";

            // Vercel 환경변수 또는 로컬 설정 키 받아오기
            const apiKey = window.ENV_API_KEY || ""; 

            const prompt = `너는 아이폰 패닉풀 전문 수리기사 보조 AI다. 제공된 패닉풀 로그 사진을 정밀 분석하라.
1. 원인 코드(Prs0, Mic2, Thermal 등) 및 검증된 원인 부품 명시
2. 점검 우선순위 (1순위, 2순위...)
3. iFixit 가이드 요약 및 핵심 주의사항 (Short screw damage, 배터리 선차단 등)
* Apple 공식 수리 매뉴얼과 iFixit 팩트 기반으로만 정밀 작성하라.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });
                
                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                resultContent.innerText = text;
            } catch (err) {
                resultContent.innerText = "❌ 진단 도중 오류가 발생했습니다. API 키 및 사진을 확인해 주세요.";
            } finally {
                btn.disabled = false;
                btn.innerText = "⚡ 패닉 로그 진단 시작";
            }
        }
    </script>
</body>
</html>
